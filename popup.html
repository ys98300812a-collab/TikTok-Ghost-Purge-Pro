<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 延用原本 1.1 版的樣式並微調 */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --accent: #fe2c55; --accent2: #25f4ee; --text: #f1f1f1; --muted: #888; --radius: 10px; }
    body { width: 360px; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; padding: 0; }
    .header { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid var(--border); }
    .logo { font-size: 24px; }
    .config-box { padding: 10px 16px; background: #1a1a1a; margin: 10px 16px; border-radius: var(--radius); border: 1px solid var(--border); }
    .config-box label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .config-box input { width: 100%; background: #000; border: 1px solid var(--border); color: var(--accent2); padding: 8px; border-radius: 4px; font-weight: bold; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 16px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--text); }
    .btn-row { display: flex; gap: 8px; padding: 16px; }
    button { flex: 1; padding: 12px; border: none; border-radius: var(--radius); cursor: pointer; font-weight: bold; }
    #btn-start { background: var(--accent); color: #fff; }
    #btn-stop { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .log-wrap { margin: 0 16px 16px; background: #000; height: 100px; overflow-y: auto; font-size: 11px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
  </style>
</head>
<body>
<div class="header"><div class="logo">🧹</div><div><h1 style="font-size:15px">封號清理器 3.0</h1><p style="font-size:11px;color:var(--muted)">斷點續傳旗艦版</p></div></div>

<div class="config-box">
  <label>🚀 起始序號 (上次卡在幾號就填幾)：</label>
  <input type="number" id="input-skip" value="0">
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="stat-total">0</div><div style="font-size:10px;color:var(--muted)">掃描序號</div></div>
  <div class="stat"><div class="stat-num" style="color:var(--accent)" id="stat-removed">0</div><div style="font-size:10px;color:var(--muted)">已清除</div></div>
  <div class="stat"><div class="stat-num" style="color:var(--accent2)" id="stat-skipped">0</div><div style="font-size:10px;color:var(--muted)">已跳過</div></div>
</div>

<div class="log-wrap" id="log"></div>

<div class="btn-row">
  <button id="btn-start">▶ 開始執行</button>
  <button id="btn-stop" disabled>⏹ 停止</button>
</div>
<script src="popup.js"></script>
</body>
</html>
